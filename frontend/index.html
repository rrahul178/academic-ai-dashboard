<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academic AI Dashboard — Sign in</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>Academic AI Dashboard</h1>
    <p class="sub">Sign in to view attendance, scheduling, and risk insights.</p>
    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required value="admin@pahmc.edu.bd">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required value="admin123">
      </div>
      <button type="submit" class="primary">Sign in</button>
      <div class="form-error" id="form-error"></div>
    </form>
    <div class="demo-hint">
      Demo credentials are pre-filled. Backend: PHP JWT auth at
      <code>backend-php/auth.php</code>.
    </div>
  </div>
</div>
<script src="js/api.js"></script>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('form-error');
  errorEl.textContent = '';
  try {
    const { token, user } = await api.login(
      document.getElementById('email').value,
      document.getElementById('password').value
    );
    localStorage.setItem('aad_token', token);
    localStorage.setItem('aad_user', JSON.stringify(user));
    window.location.href = 'dashboard.html';
  } catch (err) {
    errorEl.textContent = err.message || 'Sign in failed. Check the API is running.';
  }
});
</script>
</body>
</html>
